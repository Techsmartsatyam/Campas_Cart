<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGradient)" filter="url(#dropShadow)" />
  
  <!-- Location Pin Background Frame -->
  <path d="M 256 100 C 180 100 120 160 120 236 C 120 330 256 412 256 412 C 256 412 392 330 392 236 C 392 160 332 100 256 100 Z" 
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  
  <!-- Shopping Cart Icon -->
  <g transform="translate(136, 150) scale(0.95)">
    <!-- Cart Body -->
    <path d="M 20 40 L 65 40 L 95 170 C 98 182 110 190 122 190 L 220 190 C 232 190 242 182 245 170 L 270 75 L 80 75" 
          fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Cart Basket Grid Lines -->
    <line x1="110" y1="110" x2="250" y2="110" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.9" />
    <line x1="130" y1="145" x2="235" y2="145" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.9" />
    
    <!-- Wheels -->
    <circle cx="125" cy="225" r="18" fill="#ffffff" />
    <circle cx="215" cy="225" r="18" fill="#ffffff" />
  </g>
</svg>